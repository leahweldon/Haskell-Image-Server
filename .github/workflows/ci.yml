name: Haskell CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          enable-stack: true
          stack-version: 'latest'
      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'package.yaml') }}
          restore-keys: stack-${{ runner.os }}-
      - name: Build
        run: stack --no-terminal build
      - name: Test
        run: stack --no-terminal test
      - name: Render showcase
        run: stack --no-terminal exec showcase
      - name: Upload rendered images
        uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: docs/showcase/*.png
